[tools]
bun = "1.3"
node = "24"
python = "3.14"
uv = "latest"

[tasks.setup]
description = "Install all dependencies and git hooks"
run = """
bun install ${CI:+--frozen-lockfile}
uv --directory apps/pipeline sync ${CI:+--locked}
git config core.hooksPath .githooks
"""

[tasks.dev]
description = "Run the frontend dev server"
run = "cd apps/frontend && bun run dev"

[tasks.build]
description = "Production build of the frontend"
run = "cd apps/frontend && bun run build"

[tasks.format]
description = "Format and auto-fix all code (biome, ruff)"
run = """
bunx biome check --write .
uv --directory apps/pipeline run ruff format .
uv --directory apps/pipeline run ruff check --fix .
"""

[tasks.check]
description = "Lint, format check, and type check (no modifications, for CI)"
run = """
bunx biome check .
bunx tsc --noEmit -p apps/frontend/tsconfig.json
bunx tsc --noEmit -p apps/e2e/tsconfig.json
uv --directory apps/pipeline run ruff check .
uv --directory apps/pipeline run ruff format --check .
uv --directory apps/pipeline run ty check
"""

[tasks.typecheck]
description = "Type check only (subset of check)"
run = """
bunx tsc --noEmit -p apps/frontend/tsconfig.json
bunx tsc --noEmit -p apps/e2e/tsconfig.json
uv --directory apps/pipeline run ty check
"""

[tasks.test]
description = "Run unit and component tests (vitest, pytest)"
run = """
(cd apps/frontend && bunx vitest run)
uv --directory apps/pipeline run pytest
"""

[tasks."test:watch"]
description = "Run vitest in watch mode"
run = "cd apps/frontend && bunx vitest"

[tasks."test:e2e"]
description = "Run Playwright end-to-end tests against a production build"
run = "cd apps/e2e && bunx playwright test"

[tasks."data:roster"]
description = "Build the aircraft roster from the pinned datamine (data/ROSTER.md, data/roster.json)"
run = "uv run --project apps/pipeline bfm-pipeline roster"

[tasks."data:extract"]
description = "Extract basic fields for every roster aircraft (data/EXTRACTION.md)"
run = "uv run --project apps/pipeline bfm-pipeline extract"

[tasks."data:record"]
description = "Record an in-game test flight, e.g. mise run data:record -- --aircraft f_16c_block_50 --card A --run 1"
run = "uv run --project apps/pipeline bfm-pipeline record"

[tasks."data:analyse"]
description = "Analyse recorded test flights, e.g. mise run data:analyse -- apps/pipeline/validation/flights/.../A-*.jsonl.gz"
run = "uv run --project apps/pipeline bfm-pipeline analyse"

[tasks."data:inspect"]
description = "Print raw datamine fields, e.g. mise run data:inspect -- f_16c_block_50 --path Mass"
run = "uv run --project apps/pipeline bfm-pipeline inspect"

[tasks."rules:sync"]
description = "Regenerate AI config files from .rulesync/"
run = "npx -y rulesync@32.0.0 generate"

[tasks."rules:check"]
description = "Check AI config files are in sync with .rulesync/"
run = """
bash scripts/check-mise-docs-sync.sh
npx -y rulesync@32.0.0 generate
if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
  echo "ERROR: AI config files are out of sync with .rulesync/"
  echo "Run: mise run rules:sync"
  git status --short
  exit 1
fi
echo "AI config files are in sync"
"""
