[project]
name = "bfm-pipeline"
version = "0.1.0"
description = "Extracts War Thunder flight-model data from the community datamine for BFM Analysis"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["pydantic>=2.14", "typer>=0.27"]

[project.scripts]
bfm-pipeline = "bfm_pipeline.cli:app"

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.17", "ty>=0.0.86"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PTH"]
# En dashes ("12.0–14.7"), multiplication signs ("2 × area") and α (angle of attack) are deliberate.
allowed-confusables = ["–", "×", "−", "α"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
